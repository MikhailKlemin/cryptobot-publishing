<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/research.css" | relURL }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home">
        <span class="brand-mark" aria-hidden="true">CB</span>
        <span>{{ site.Title }}</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        {{ range site.Menus.main }}
          <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>Notes from a closed crypto-strategy research project.</p>
      <p>Research closed · method and evidence preserved.</p>
    </div>
  </footer>
</body>
</html>
